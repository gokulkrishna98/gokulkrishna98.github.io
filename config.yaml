baseURL: http://example.org/
title: Gokul's Website
languageCode: en-us
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

enableEmoji: true

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true

params:
  env: production
  title: Gokul's Webiste
  description: "Experimentation and Recording my foolish discoveries"
  keywords: [Blog, Portfolio, PaperMod]
  author: Gokul
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  math: true
  # disableThemeToggle: false

  # # read more about this section
  ShowReadingTime: true
  # ShowShareButtons: true
  # ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  # ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  # disableSpecial1stPost: false
  # disableScrollToTop: false
  # comments: false
  # hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false  

  # home-info mode
  homeInfoParams:
    Title: "Hi \U0001F9CC"
    Content: "I am Gokul, I am interested in Machine Learning, High performance computing and Compilers. 
    Currently working on OnDevice Machine Learning, CoreML Tools @ Apple. I completed my masters in
    computer science from NYU Courant, focusing on Deep Learning and Parallel computing. I also worked as an engineer at
    Samsung Research Bangalore. My Passion currently lies in exploring the Deep learning, MLSystems and Compilers. Please
    ignore grammatical errors in my blogs, most of the content is freestyled out of my mind."
    imageUrl: "/images/gokul_profile_image.jpg"
    imageWidth: 30
    imageHeight: 30
    imageTitle: image
    responsiveImages: false

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/m-gokulkrishna/"
    - name: github
      url: "https://github.com/gokulkrishna98"
    - name: bluesky
      url: "https://bsky.app/profile/cow-school.bsky.social"
    - name: x
      url: "https://x.com/gokul_sage"
    - name: resume
      url: "https://github.com/gokulkrishna98/gokulkrishna98.github.io/blob/main/assets/images/Gokul_Resume_25-01-2025.pdf"
